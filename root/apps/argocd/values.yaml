# Alles unter 'argo-cd', da es eine Dependency ist
argo-cd:
  # 1. SERVER AUF HTTP (INSECURE) STELLEN
  server:
    extraArgs:
      - --insecure
    
    # 2. INGRESS FÜR TRAEFIK ANPASSEN
    ingress:
      enabled: true
      ingressClassName: traefik # <-- Geändert von nginx auf traefik
      https: false              # WICHTIG: Sagt dem Ingress, er soll Port 80 nutzen
      
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # TRAEFIK SPEZIFISCHE ANNOTATIONS (Übersetzt von Nginx):
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/service.serversscheme: http # Das ist das "backend-protocol: HTTP" für Traefik

      hosts:
        - jakob-argocd.goava.ai
      tls:
        - secretName: argocd-server-tls
          hosts:
            - jakob-argocd.goava.ai

  # 3. NETZWERK-MAUERN EINREISSEN
  networkPolicies:
    enabled: false

  # 4. CONFIG-PARAMETER SETZEN
  configs:
    params:
      server.insecure: "true"
