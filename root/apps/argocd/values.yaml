argo-cd:
  # 1. GLOBAL: Wir sagen Argo CD, dass wir KEIN TLS wollen
  configs:
    params:
      server.insecure: "true"

  server:
    # 2. Wir geben das Flag ZUSÄTZLICH mit (Doppelt hält besser)
    extraArgs:
      - --insecure

    ingress:
      enabled: true
      ingressClassName: traefik
      # 3. WICHTIG: Der Ingress soll jetzt den HTTP-Port nutzen
      https: false 
      
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        # 4. Traefik sagen: "Sprich Klartext (HTTP) mit dem Pod"
        traefik.ingress.kubernetes.io/service.serversscheme: http

      hosts:
        - jakob-argocd.goava.ai
      tls:
        - secretName: argocd-server-tls
          hosts:
            - jakob-argocd.goava.ai

  # 5. NetworkPolicies aus, damit der Traffic fließen kann
  networkPolicies:
    enabled: false
