# -------------------------------------------------------------------------
# DEINE ARGO CD VALUES.YAML
# Domain: jakob-argocd.goava.ai
# Ingress: Traefik
# -------------------------------------------------------------------------

global:
  domain: jakob-argocd.goava.ai

server:
  # Deaktiviert das interne Argo CD HTTPS, da Traefik das übernimmt
  extraArgs:
    - --insecure
    
  ingress:
    enabled: true
    # Hier ist die wichtige Änderung für deinen Cluster:
    ingressClassName: traefik 
    
    # Falls du cert-manager nutzt (lass es drin, falls ja. Wenn nicht, stört es meistens auch nicht)
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod 
      
    hosts:
      - jakob-argocd.goava.ai
    tls:
      - secretName: argocd-server-tls
        hosts:
          - jakob-argocd.goava.ai

configs:
  params:
    server.insecure: true
