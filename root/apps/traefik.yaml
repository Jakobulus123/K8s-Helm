apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 34.0.0
    helm:
      values: |
        service:
          annotations:
            # Das sagt Hetzner: "Bau mir einen LoadBalancer!"
            networks.hep.double.cloud/load-balancer-type: "lb11" 
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true # Argo CD erstellt den Namespace 'traefik' automatisch
