apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-deployment
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.3.11
    helm:
      values: |
        # --- DAS IST DER ENTSCHEIDENDE FIX ---
        fullnameOverride: "argocd"
        # --------------------------------------
        server:
          extraArgs:
          - --insecure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
