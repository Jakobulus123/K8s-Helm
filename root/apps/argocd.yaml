apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-deployment
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.3.11
    helm:
      values: |
        fullnameOverride: "argocd"
        
        # Das hier ist die Brücke zu deiner manuellen Installation
        global:
          additionalLabels:
            app.kubernetes.io/instance: argocd
            
        server:
          extraArgs:
            - --insecure
            
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Erlaubt Argo, bestehende Ressourcen sanfter zu übernehmen
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-initial-admin-secret
      jsonPointers:
        - /data
