apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/DEIN-REPO/argocd-gitops
    targetRevision: HEAD
    path: .

    helm:
      valueFiles:
        - values/argocd-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
