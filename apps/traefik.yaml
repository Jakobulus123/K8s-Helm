apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: 26.0.0

    helm:
      values: |
        providers:
          kubernetesIngress:
            enabled: true

        ports:
          web:
            port: 80
          websecure:
            port: 443

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
