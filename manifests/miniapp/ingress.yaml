---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: miniapp-tls
  namespace: miniapp
spec:
  secretName: miniapp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - jakob-miniapp.goava.ai
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniapp
  namespace: miniapp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jakob-miniapp.goava.ai`)
      kind: Rule
      services:
        - name: miniapp
          port: 80
  tls:
    secretName: miniapp-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniapp-http
  namespace: miniapp
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jakob-miniapp.goava.ai`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: miniapp
      services:
        - name: miniapp
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: miniapp
spec:
  redirectScheme:
    scheme: https
    permanent: true
