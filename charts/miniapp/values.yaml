# Default values for miniapp.

replicaCount: 2

image:
  repository: ghcr.io/jakobulus123/miniapp
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

resources: {}
